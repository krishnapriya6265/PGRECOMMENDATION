<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forgot_password.css') }}">    
</head>

<body>

<!-- NAVBAR -->
<nav>

        <div class="logo-container">
            <img src="{{url_for('static', filename='logo.png')}}" alt="logo" class="logo-img">
            <span class="logo-text">Smart PG Hub</span>

        </div>
    <div class="menu">
        <a href="/home">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </div>

</nav>

<!-- BACK BUTTON -->
<div class="back-btn-container">
    <button onclick="history.back()" class="back-btn">← Back</button>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

    <div class="forgot-password-card">

        <h2>Forgot Password</h2>
        <p>Enter your email address to reset your password.</p>

        <!-- FLASH MESSAGE -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="success-msg">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}

        <!-- FORM -->
        <form action="/reset-password" method="POST" onsubmit="return validateForgotForm()" novalidate>

            <label>Email:</label><br>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            <span class="error" id="emailError"></span>

            <label>New Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter new password" required>
            <span class="error" id="passwordError"></span>

            <label>Confirm Password:</label><br>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
            <span class="error" id="confirmPasswordError"></span>

            <button type="submit">Reset</button>

        </form>

        <p><a href="/login">Back to Login</a></p>

    </div>

</div>

<script src="{{ url_for('static', filename='forgot_password.js') }}"></script>

</body>
</html>
